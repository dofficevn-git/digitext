
Global:
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./output/rec_svtr_vi
  save_epoch_step: 5
  eval_batch_step: [0, 2000]
  pretrained_model: ./pretrain/rec_svtr_lcnet/best_accuracy
  checkpoints:
  save_inference_dir: ./inference/rec_svtr_vi
  use_visualdl: false
  character_dict_path: ../../../triton/models/ocr_pipeline/1/dict_VI.txt
  use_space_char: false
  max_text_length: 80
  infer_mode: false
  save_res_path: ./output/rec/predicts_svtr_vi.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.99
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone: { name: LCNetV3, scale: 0.95 }
  Head:
    name: MultiHead
    head_list:
      - CTCHead: { Neck: { name: svtr, dims: 120, depth: 2, hidden_dims: 120, kernel_size: [1, 3], use_guide: true }, Head: { fc_decay: 1.0e-05 } }

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/rec/
    label_file_list: [./train_data/rec/train_list.txt]
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - RecConAug: { prob: 0.5, ext_data_num: 2, image_shape: [48, 320, 3] }
      - RecAug:
      - MultiLabelEncode: { gtc_encode: NRTRLabelEncode }
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys: { keep_keys: [image, label_ctc, length] }
  loader:
    shuffle: true
    batch_size_per_card: 256
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/rec/
    label_file_list: [./train_data/rec/val_list.txt]
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - MultiLabelEncode: { gtc_encode: NRTRLabelEncode }
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys: { keep_keys: [image, label_ctc, length] }
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
