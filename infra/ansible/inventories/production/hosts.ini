# Inventory production 300TB — các nhóm ánh xạ 1:1 với danh sách node ở
# docs/architecture-scale.md §S10.1 và các plane mở rộng ở §S2.
# Thay hostname/IP placeholder bằng giá trị thật (không để lọt vào lịch sử git).

# --- INGEST PLANE (active-active, §S2/§S8.4): nginx VRRP + rustus + ingest + axum + dispatcher ---
[ingest_app]
ingest-app-01
ingest-app-02

# --- COMPUTE PLANE: cụm OCR GPU (§S5.3, khuyến nghị 4) — Triton + worker Rust ---
[gpu_ocr]
gpu-ocr-01
gpu-ocr-02
gpu-ocr-03
gpu-ocr-04

# --- STORAGE PLANE: MinIO distributed EC 8+4 (~450TB raw, §S3.1) ---
[minio]
minio-01
minio-02
minio-03
minio-04
minio-05
minio-06

# --- CONTROL/DATA PLANE: Postgres primary+replica (§S7.2), Meilisearch sharded (§S7.3) ---
[postgres]
pg-01 pg_role=primary
pg-02 pg_role=replica

[meilisearch]
meili-01
meili-02
meili-03

# --- Xuyên suốt ---
[observability]
obs-01

# --- Gộp theo plane (dùng bởi playbooks/*.yml) ---
[ingest_plane:children]
ingest_app

[compute_plane:children]
gpu_ocr

[storage_plane:children]
minio

[control_plane:children]
postgres
meilisearch
ingest_app
