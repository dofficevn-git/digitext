# vLLM Qwen2.5-VL-7B-AWQ — bóc 16 trường (v2) cho DigiText.
#
# --gpu-memory-utilization là tỉ lệ trên TOÀN BỘ card, không phải phần trống.
# Card 16 GB chạy chung với OCR GPU (~3 GB): 0.55 ≈ 8,8 GB. Vintern (:3000)
# không chạy đồng thời với Qwen trên 16 GB — A/B thì stop cái này, up cái kia.
# Card ≥ 24 GB: đặt VLLM_GPU_FRACTION=0.60 và bật cả hai được.
#
# Đổi mô hình chỉ qua .env (VLLM_IMAGE, VLLM_MODEL, VLLM_SERVED_NAME, VLLM_LIMIT_MM) —
# xem dev/qwen3-vl.env.example. OCR đọc tên mô hình ở OCR_HW_MODEL (compose ocr/.env).
#
# --max-model-len 4096 gắn với MODEL_MAX_LEN_V2 trong
# crates/digitext-ocr/src/vlm_prompt_v2.rs — đổi một bên phải đổi bên kia.
name: digitext-vllm

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.7.3}
    restart: unless-stopped
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}"
      - "--served-model-name"
      - "${VLLM_SERVED_NAME:-Qwen2.5-VL-7B-Instruct-AWQ}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8003"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_FRACTION:-0.55}"
      - "--max-model-len"
      # 28/9/2026: 8192 để bóc trường kèm chữ OCR + ví dụ (dạy bằng ví dụ). Khớp DIGITEXT_VLM_MAX_LEN của worker.
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      - "--limit-mm-per-prompt"
      # vLLM mới (≥0.10) nhận dạng JSON: VLLM_LIMIT_MM='{"image":1}'
      - "${VLLM_LIMIT_MM:-image=1}"
      - "--dtype"
      - "half"
      - "--enforce-eager"
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-4}"
    ports:
      # Mặc định loopback. Worker DigiText ở máy khác thì đặt VLLM_BIND=0.0.0.0
      # trong .env cạnh file này. vLLM KHÔNG có xác thực — chỉ mở trong LAN tin cậy.
      - "${VLLM_BIND:-127.0.0.1}:8003:8003"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sf localhost:8003/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 40
      start_period: 600s

volumes:
  hf_cache:
