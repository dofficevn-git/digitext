# vLLM Qwen2.5-VL-7B-AWQ — bóc 16 trường (v2) cho DigiText.
#
# --gpu-memory-utilization là tỉ lệ trên TOÀN BỘ card, không phải phần trống.
# Card 16 GB chạy chung với OCR GPU (~3 GB): 0.55 ≈ 8,8 GB. Vintern (:3000)
# không chạy đồng thời với Qwen trên 16 GB — A/B thì stop cái này, up cái kia.
# Card ≥ 24 GB: đặt VLLM_GPU_FRACTION=0.60 và bật cả hai được.
#
# Đổi mô hình chỉ qua .env (VLLM_IMAGE, VLLM_MODEL, VLLM_SERVED_NAME, VLLM_LIMIT_MM) —
# xem dev/qwen3-vl.env.example. OCR đọc tên mô hình ở OCR_HW_MODEL (compose ocr/.env).
#
# --max-model-len 4096 gắn với MODEL_MAX_LEN_V2 trong
# crates/digitext-ocr/src/vlm_prompt_v2.rs — đổi một bên phải đổi bên kia.
name: digitext-vllm

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.7.3}
    restart: unless-stopped
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}"
      - "--served-model-name"
      - "${VLLM_SERVED_NAME:-Qwen2.5-VL-7B-Instruct-AWQ}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8003"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_FRACTION:-0.55}"
      - "--max-model-len"
      # 28/9/2026: 8192 để bóc trường kèm chữ OCR + ví dụ (dạy bằng ví dụ). Khớp DIGITEXT_VLM_MAX_LEN của worker.
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--limit-mm-per-prompt"
      # vLLM mới (≥0.10) nhận dạng JSON: VLLM_LIMIT_MM='{"image":1}'
      - "${VLLM_LIMIT_MM:-image=1}"
      - "--dtype"
      - "half"
      # 30/10/2026: đồng bộ với lệnh đang chạy thật trên Alienware (docker inspect): bỏ --enforce-eager
      # (CUDA graph nhanh hơn), KV cache fp8 (tiết kiệm VRAM, card 16 GB chạy chung OCR), không cache
      # bộ tiền xử lý ảnh (mỗi ảnh một prompt, cache chỉ tốn RAM). Mặc định 16 lượt / 8192 token như Alienware.
      - "--kv-cache-dtype"
      - "${VLLM_KV_DTYPE:-fp8}"
      - "--mm-processor-cache-gb"
      - "${VLLM_MM_CACHE_GB:-0}"
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-16}"
    ports:
      # Mặc định loopback. Worker DigiText ở máy khác thì đặt VLLM_BIND=0.0.0.0
      # trong .env cạnh file này. vLLM KHÔNG có xác thực — chỉ mở trong LAN tin cậy.
      - "${VLLM_BIND:-127.0.0.1}:8003:8003"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    # 2/10/2026: sau 3 ngày chạy, EngineCore chiếm 21 GB RAM → máy 30 GB phải swap 12 GB, dịch vụ OCR (:5002) treo,
    # hàng đợi 387k trang đứng từ 05:12. Chặn trần: vượt thì chỉ vLLM bị giết và tự chạy lại, OCR không bị kéo theo.
    mem_limit: ${VLLM_MEM_LIMIT:-16g}
    memswap_limit: ${VLLM_MEM_LIMIT:-16g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Máy có iGPU (Ryzen 9950X trên OCR PC): chọn đúng card bằng UUID từ `nvidia-smi -L`
              # (GPU_DEVICE_ID=GPU-xxxx trong .env). Mặc định "0" = card đầu, đúng với Alienware.
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -sf localhost:8003/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 60
      # Lần đầu trên máy mới: tải model ~6 GB + biên dịch CUDA graph → có thể quá 10 phút.
      start_period: ${VLLM_START_PERIOD:-600s}

volumes:
  hf_cache:
