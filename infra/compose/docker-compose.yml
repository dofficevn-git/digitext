name: digitext-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:?dat PG_USER trong infra/compose/.env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?dat PG_PASSWORD trong infra/compose/.env}
      POSTGRES_DB: ${PG_DB:?dat PG_DB trong infra/compose/.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?dat MINIO_USER trong infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?dat MINIO_PASSWORD trong infra/compose/.env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:?dat MEILI_KEY trong infra/compose/.env}
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meilidata:/meili_data"]

  rustus:
    image: s3rius/rustus:latest
    command: --hooks-http-urls http://ingest:8081/webhook/tus
    ports: ["127.0.0.1:1080:1080"]
    volumes: ["rustusdata:/data"]

  nginx:
    image: nginx:stable
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./nginx:/etc/nginx/conf.d:ro"]
    depends_on: [minio, meilisearch, rustus]

volumes:
  pgdata:
  miniodata:
  meilidata:
  rustusdata:
