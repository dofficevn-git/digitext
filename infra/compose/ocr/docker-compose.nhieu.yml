# 27/11/2026: Qwen chay chung card 16 GB voi OCR. Mot tien trinh OCR chi dung ~1,6 nhan CPU (GIL) nen chay
# NHIEU ban sao (--scale ocr=N, cong 5012-501x) sau nginx chia tai cong 5010; worker tro vao 5010.
# Bat:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.nhieu.yml up -d --no-build --scale ocr=N
# Doi so ban sao xong phai restart chia-tai (nginx chi phan giai ten "ocr" luc khoi dong).
services:
  ocr:
    environment:
      PYTORCH_CUDA_ALLOC_CONF: "${OCR_TORCH_ALLOC_CONF:-garbage_collection_threshold:0.12}"
      OCR_GPU_TRIM: "${OCR_GPU_TRIM:-true}"
    volumes:
      - ../../../ocr/ocr_fulltext.py:/app/ocr_fulltext.py:ro
  chia-tai:
    image: digitext-chia-tai:1
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on: [ocr]
    ports:
      - "127.0.0.1:5010:80"
    volumes:
      - ./chia-tai.conf:/etc/nginx/http.d/default.conf:ro