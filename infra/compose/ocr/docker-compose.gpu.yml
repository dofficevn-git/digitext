# Overlay GPU cho dịch vụ OCR toàn văn — chồng lên docker-compose.yml:
#
#   docker compose -f infra/compose/ocr/docker-compose.yml -f infra/compose/ocr/docker-compose.gpu.yml \
#     --env-file infra/compose/ocr/.env up -d --build
#
# Yêu cầu máy chủ: driver NVIDIA + nvidia-container-toolkit (scripts/setup-ai-node.sh
# lo cả hai; Docker Desktop WSL2 trên Windows có sẵn GPU-PV, không cần toolkit).
# Kiểm nhanh: docker run --rm --gpus all nvidia/cuda:12.1.1-base-ubuntu22.04 nvidia-smi
#
# Rollback: bỏ `-f docker-compose.gpu.yml` và up -d --build lại → biến thể CPU.
#
# Hai thế hệ card, chọn bằng .env (30/10/2026):
#   - Mặc định (Alienware, RTX 40xx trở xuống): CUDA 12.1 + torch 2.4.1 cu121 + Paddle 2.6.2 — đang chạy thật.
#   - Blackwell (RTX 5070 Ti trên OCR PC, sm_120): Paddle 2.6 / cuDNN 8 / torch cu121 KHÔNG có kernel sm_120.
#     Chép các dòng trong infra/compose/ocr/.env.rtx5070.example vào .env rồi up -d --build.
#
# VRAM (card 16 GB, chạy chung với vLLM): dịch vụ này giữ ≤ ~3 GB với
# OCR_DET_GPU_MEM_MB=1024, OCR_REC_BATCH=32, OCR_GPU_CONCURRENCY=2. Đo bằng
# `nvidia-smi --query-compute-apps=pid,used_memory --format=csv` sau ~20 request,
# không đo lúc container vừa Started.

services:
  ocr:
    build:
      args:
        BASE_IMAGE: "${OCR_CUDA_IMAGE:-nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04}"
        TORCH_INDEX: "${OCR_TORCH_INDEX:-https://download.pytorch.org/whl/cu121}"
        TORCH_VERSION: "${OCR_TORCH_VERSION:-2.4.1}"
        TORCHVISION_VERSION: "${OCR_TORCHVISION_VERSION:-0.19.1}"
        OCR_REQS: "${OCR_REQS:-requirements-ocr-gpu.txt}"
        OCR_USE_GPU: "true"
    environment:
      OCR_USE_GPU: "true"
      OCR_REC_BATCH: "${OCR_REC_BATCH:-32}"
      # Decode ảnh, warp crop, mã hoá JSON vẫn là CPU — nới hơn bản CPU-only
      # nhưng không thả nổi: đã có lần OOM kéo sập cả phiên đồ hoạ trên node GPU.
    mem_limit: ${OCR_MEM_LIMIT:-8g}
    cpus: ${OCR_CPUS:-6}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Máy có iGPU: GPU_DEVICE_ID=GPU-<uuid> (nvidia-smi -L). Mặc định card đầu.
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
