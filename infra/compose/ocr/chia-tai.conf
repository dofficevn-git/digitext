# Chia tai OCR (27/11/2026): cac ban sao OCR tren OCR PC (ten "ocr" trong mang compose) + dich vu OCR o
# Alienware 192.168.100.11:5002 (RTX 4090; da so 15 trang that: giong 99,86 %, cung khoa X-API-Key).
# Alienware roi mang: nginx tu bo qua no (max_fails / fail_timeout) va chuyen yeu cau sang may con lai.
upstream ocr_cum {
  least_conn;
  server ocr:5002 max_fails=0;
  server 192.168.100.11:5002 weight=3 max_fails=2 fail_timeout=60s;
}
server {
  listen 80;
  client_max_body_size 300m;
  location / {
    proxy_pass http://ocr_cum;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
  }
}
