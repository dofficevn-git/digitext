# Dịch vụ OCR toàn văn — TIẾN TRÌNH RIÊNG, không thuộc workspace Rust.
# DigiText chỉ biết tới nó qua DIGITEXT_OCR_HTTP_ENDPOINT, đúng như từng chỉ
# biết Triton qua DIGITEXT_TRITON_ENDPOINT.
#
#   docker compose -f infra/compose/ocr/docker-compose.yml --env-file infra/compose/ocr/.env up -d --build

name: digitext-ocr-fulltext

services:
  ocr:
    build:
      # Nguồn nằm ở ocr/ gốc repo; Dockerfile ở đây.
      context: ../../../ocr
      dockerfile: ../infra/compose/ocr/Dockerfile
    restart: unless-stopped
    ports:
      # Mặc định loopback: DigiText gọi từ cùng máy.
      # Khác máy thì đặt OCR_BIND=0.0.0.0 trong .env — KHÔNG sửa file này, để
      # lần cập nhật sau không ghi đè mất lựa chọn của bạn.
      # Mở ra LAN thì OCR_API_KEY là thứ DUY NHẤT chặn người khác dùng.
      - "${OCR_BIND:-127.0.0.1}:${OCR_PORT:-5002}:5002"
    environment:
      OCR_HOST: "0.0.0.0"
      OCR_PORT: "5002"
      OCR_THREADS: "${OCR_THREADS:-4}"
      OCR_LANG: "${OCR_LANG:-vi}"
      OCR_USE_GPU: "${OCR_USE_GPU:-false}"
      OCR_REC_BATCH: "${OCR_REC_BATCH:-8}"
      OCR_API_KEY: "${OCR_API_KEY:?dat OCR_API_KEY trong infra/compose/ocr/.env}"
    # Trần bộ nhớ. Không có nó thì một ảnh bất thường có thể đẩy container ăn
    # hết RAM máy chủ; trên máy KHÔNG CÓ SWAP, OOM killer sẽ kéo sập cả phiên
    # đồ hoạ chứ không chỉ giết container. Đã xảy ra trên node GPU.
    # Chạm trần thì container tự chết và restart — thiệt hại gói gọn ở đây.
    mem_limit: ${OCR_MEM_LIMIT:-6g}
    cpus: ${OCR_CPUS:-4}
    volumes:
      # Trọng số PaddleOCR (~100MB) tải ở lần chạy đầu. Không có volume này thì
      # mỗi lần dựng lại container là tải lại.
      - paddlecache:/models
      # Trọng số VietOCR (145MB) — artifact, cấp phát khi triển khai, không
      # commit. Tải một lần: xem ocr/vietocr_config/vgg_transformer.yml.
      - ../../../ocr/models/vietocr:/models/vietocr:ro

volumes:
  paddlecache:
