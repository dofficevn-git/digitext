# Dịch vụ OCR toàn văn — TIẾN TRÌNH RIÊNG, không thuộc workspace Rust.
# DigiText chỉ biết tới nó qua DIGITEXT_OCR_HTTP_ENDPOINT, đúng như từng chỉ
# biết Triton qua DIGITEXT_TRITON_ENDPOINT.
#
#   docker compose -f infra/compose/ocr/docker-compose.yml --env-file infra/compose/ocr/.env up -d --build
#
# Máy có GPU NVIDIA: chồng thêm docker-compose.gpu.yml (base CUDA, paddle-gpu,
# cấp GPU cho container). File này giữ nguyên biến thể CPU để máy không GPU và
# rollback vẫn dùng được.
#   docker compose -f infra/compose/ocr/docker-compose.yml -f infra/compose/ocr/docker-compose.gpu.yml \
#     --env-file infra/compose/ocr/.env up -d --build

name: digitext-ocr-fulltext

services:
  ocr:
    build:
      # Nguồn nằm ở ocr/ gốc repo; Dockerfile ở đây.
      context: ../../../ocr
      dockerfile: ../infra/compose/ocr/Dockerfile
    restart: unless-stopped
    # host.docker.internal → máy chủ chứa container, để tới vLLM (compose vllm) ở cổng
    # 8003 của host cho lớp dự phòng chữ viết tay. Trên Linux cần dòng này (Docker Desktop
    # có sẵn).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Mặc định loopback: DigiText gọi từ cùng máy.
      # Khác máy thì đặt OCR_BIND=0.0.0.0 trong .env — KHÔNG sửa file này, để
      # lần cập nhật sau không ghi đè mất lựa chọn của bạn.
      # Mở ra LAN thì OCR_API_KEY là thứ DUY NHẤT chặn người khác dùng.
      - "${OCR_BIND:-127.0.0.1}:${OCR_PORT:-5002}:5002"
    environment:
      OCR_HOST: "0.0.0.0"
      OCR_PORT: "5002"
      OCR_THREADS: "${OCR_THREADS:-4}"
      OCR_DET_LANG: "${OCR_DET_LANG:-en}"
      OCR_USE_GPU: "${OCR_USE_GPU:-false}"
      OCR_REC_BATCH: "${OCR_REC_BATCH:-8}"
      # Trọng số VietOCR đang phục vụ. Đổi sang bản fine-tune = đổi biến này +
      # up -d, không chép đè file gốc (giữ được đường rollback).
      OCR_REC_WEIGHTS: "${OCR_REC_WEIGHTS:-/models/vietocr/vgg_transformer.pth}"
      # Đệm khung crop (tỉ lệ theo chiều cao dòng) trước khi nhận dạng — giữ dấu
      # nặng/dấu trên chữ hoa khỏi bị cắt. Đo 17/9/2026: 0 → 0.12/0.15 nâng đồng
      # thuận ký tự 96,9% → 97,8%, dòng khớp tuyệt đối 50% → 67%.
      OCR_CROP_PAD_Y: "${OCR_CROP_PAD_Y:-0.12}"
      OCR_CROP_PAD_X: "${OCR_CROP_PAD_X:-0.15}"
      # Lớp dự phòng chữ viết tay (ocr/handwriting.py): dòng VietOCR tin cậy < OCR_HW_CONF
      # được gửi sang VLM (Qwen2.5-VL ở compose vllm, cổng 8003 trên host). Trống = tắt.
      OCR_HW_VLM_URL: "${OCR_HW_VLM_URL:-}"
      OCR_HW_MODEL: "${OCR_HW_MODEL:-Qwen2.5-VL-7B-Instruct-AWQ}"
      OCR_HW_CONF: "${OCR_HW_CONF:-0.85}"
      OCR_HW_MAX_PER_PAGE: "${OCR_HW_MAX_PER_PAGE:-15}"
      # Lưới an toàn phát hiện dòng theo NÉT MỰC (ocr/inklines.py): DBNet sót chữ viết tay →
      # sinh khung cho mực chưa có khung; trả thêm ink_coverage (độ phủ mực) mỗi tile.
      OCR_INK_LINES: "${OCR_INK_LINES:-true}"
      OCR_INK_TRUST_CONF: "${OCR_INK_TRUST_CONF:-0.85}"
      OCR_GPU_CONCURRENCY: "${OCR_GPU_CONCURRENCY:-2}"
      OCR_DET_GPU_MEM_MB: "${OCR_DET_GPU_MEM_MB:-1024}"
      OCR_LOG_TIMING: "${OCR_LOG_TIMING:-true}"
      OCR_API_KEY: "${OCR_API_KEY:?dat OCR_API_KEY trong infra/compose/ocr/.env}"
    # Trần bộ nhớ. Không có nó thì một ảnh bất thường có thể đẩy container ăn
    # hết RAM máy chủ; trên máy KHÔNG CÓ SWAP, OOM killer sẽ kéo sập cả phiên
    # đồ hoạ chứ không chỉ giết container. Đã xảy ra trên node GPU.
    # Chạm trần thì container tự chết và restart — thiệt hại gói gọn ở đây.
    mem_limit: ${OCR_MEM_LIMIT:-6g}
    cpus: ${OCR_CPUS:-4}
    volumes:
      # Trọng số PaddleOCR (~100MB) tải ở lần chạy đầu. Không có volume này thì
      # mỗi lần dựng lại container là tải lại.
      - paddlecache:/models
      # Trọng số VietOCR (145MB) — artifact, cấp phát khi triển khai, không
      # commit. Tải một lần: xem ocr/vietocr_config/vgg_transformer.yml.
      - ../../../ocr/models/vietocr:/models/vietocr:ro

volumes:
  paddlecache:
