[package]
name = "digitext-token-signpdf"
version = "0.1.0"
edition = "2021"
publish = false


[[bin]]
name = "token-signpdf"
path = "src/main.rs"

[dependencies]
digitext-sign-verify = { path = "../digitext-sign-verify" }
cryptoki = "0.8"
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["oid"] }
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
rpassword = "7"
lopdf = "0.43"
chrono = "0.4"
unicode-normalization = "0.1"
ureq = "2"
pem = "3"

[dev-dependencies]
digitext-pdf = { path = "../digitext-pdf" }
