[package]
name = "digitext-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
digitext-core = { path = "../digitext-core" }
digitext-db = { path = "../digitext-db" }
digitext-storage = { path = "../digitext-storage" }
digitext-pdf = { path = "../digitext-pdf" }
digitext-package = { path = "../digitext-package" }
digitext-pkgcheck = { path = "../digitext-pkgcheck" }
digitext-sign-verify = { path = "../digitext-sign-verify" }
digitext-telemetry = { path = "../digitext-telemetry" }
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
lopdf = "0.43"
rand = { workspace = true }
reqwest = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
lopdf = "0.43"
tower = { workspace = true, features = ["util"] }
x509-cert = { version = "0.2", features = ["builder"] }
sha2 = "0.10"
der = "0.7"
rand = "0.8"
