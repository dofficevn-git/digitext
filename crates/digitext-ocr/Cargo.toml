[package]
name = "digitext-ocr"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.cargo-machete]
ignored = ["prost"]


[lib]
name = "digitext_ocr"
path = "src/lib.rs"

[[bin]]
name = "digitext-ocr"
path = "src/main.rs"

[dependencies]
digitext-core = { path = "../digitext-core" }
digitext-db = { path = "../digitext-db" }
digitext-pdf = { path = "../digitext-pdf" }
digitext-storage = { path = "../digitext-storage" }
digitext-package = { path = "../digitext-package" }
digitext-vi = { path = "../digitext-vi" }
digitext-telemetry = { path = "../digitext-telemetry" }
axum = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tracing = { workspace = true }
uuid = { workspace = true }
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "codegen"] }
prost = "0.13"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
lopdf = "0.43"
zip = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
