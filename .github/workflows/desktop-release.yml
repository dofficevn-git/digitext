# Dựng bộ cài DigiText desktop và tạo GitHub Release khi đẩy tag v*.
# Xem docs/DEPLOY-DESKTOP.md §4. Cần secrets TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD)
# khi đã bật tauri-plugin-updater; chưa có secrets thì vẫn dựng được exe không ký.
name: desktop-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DigiText ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
