<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIE System - Đăng nhập</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      /* ===== RESET & BASE ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 12.5px;
        color: #333;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      /* ===== BACKGROUND IMAGE ===== */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(39, 187, 77, 0.8),
          rgba(178, 231, 203, 0.8),
          rgba(21, 108, 62, 0.8)
        );
        background-size: cover;
        background-position: center;
        z-index: -1;
      }

      /* ===== LOGIN CONTAINER ===== */
      .container {
        position: relative;
        z-index: 1;
      }

      /* ===== LOGIN CARD ===== */
      .login-card {
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0px 3px 8px #787878;
        overflow: hidden;
        width: 340px;
        margin: 0 auto;
      }

      /* ===== LOGIN HEADER ===== */
      .login-header {
        background: #ffffff;
        padding: 30px 20px 20px;
        text-align: center;
      }

      .login-header img {
        width: 60%;
        max-width: 180px;
        margin: 0 auto;
        display: block;
      }

      .login-header h3 {
        color: #156c3e;
        font-weight: 900;
        font-size: 18px;
        margin-top: 15px;
        margin-bottom: 5px;
        text-transform: uppercase;
      }

      .login-header p {
        color: #6c757d;
        font-size: 12px;
        margin: 0;
      }

      /* ===== LOGIN BODY ===== */
      .login-body {
        padding: 20px 30px 30px;
        background: #ffffff;
      }

      /* ===== ALERT CONTAINER ===== */
      #alertContainer {
        margin-bottom: 15px;
      }

      .alert {
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        border-left: 4px solid;
        margin-bottom: 10px;
      }

      .alert-success {
        background: linear-gradient(135deg, #d4edda, #c3e6cb);
        border-left-color: #48cfad;
        color: #155724;
      }

      .alert-danger {
        background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        border-left-color: #dc3545;
        color: #721c24;
      }

      /* ===== FORM ===== */
      .form-label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #495057;
        font-size: 12px;
        display: block;
      }

      .form-control {
        width: 100%;
        padding: 10px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 12.5px;
        transition: all 0.3s ease;
        background: #ffffff;
      }

      .form-control:focus {
        outline: none;
        border-color: #51a478;
        box-shadow: 0 0 0 0.2rem rgba(81, 164, 120, 0.25);
      }

      .form-control::placeholder {
        color: #999;
      }

      .mb-3 {
        margin-bottom: 15px;
      }

      .mb-4 {
        margin-bottom: 20px;
      }

      /* ===== CHECKBOX ===== */
      .checkbox-container {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }

      .checkbox-container input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        cursor: pointer;
      }

      .checkbox-container label {
        margin: 0;
        font-size: 12px;
        color: #495057;
        cursor: pointer;
      }

      /* ===== FORGOT PASSWORD LINK ===== */
      .forgot-password {
        text-align: right;
        margin-bottom: 15px;
      }

      .forgot-password a {
        color: #51a478;
        font-size: 12px;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .forgot-password a:hover {
        color: #3d8060;
        text-decoration: underline;
      }

      /* ===== LOGIN BUTTON ===== */
      .btn-login {
        width: 100%;
        padding: 12px;
        background: #51a478;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-login:hover:not(:disabled) {
        background: #3d8060;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(81, 164, 120, 0.3);
      }

      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .btn-login i {
        font-size: 14px;
      }

      /* ===== HR DIVIDER ===== */
      hr {
        border: none;
        border-top: 1px solid #e0e0e0;
        margin: 20px 0;
      }

      /* ===== REGISTRATION LINK ===== */
      .registration {
        text-align: center;
        font-size: 12px;
        color: #6c757d;
        margin-top: 15px;
      }

      .registration a {
        color: #51a478;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .registration a:hover {
        color: #3d8060;
        text-decoration: underline;
      }

      /* ===== SPINNER ANIMATION ===== */
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .fa-spin {
        animation: spin 1s linear infinite;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 576px) {
        .login-card {
          width: 90%;
          margin: 20px auto;
        }

        .login-body {
          padding: 20px;
        }

        .login-header {
          padding: 20px 15px 15px;
        }

        .login-header h3 {
          font-size: 16px;
        }
      }

      /* ===== FADE IN ANIMATION ===== */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-card {
        animation: fadeIn 0.5s ease;
      }

      /* ===== ALERT BUTTON CLOSE ===== */
      .alert .btn-close {
        padding: 0;
        background: transparent;
        border: none;
        font-size: 16px;
        color: inherit;
        opacity: 0.5;
        cursor: pointer;
        float: right;
        margin-left: 10px;
      }

      .alert .btn-close:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="login-card">
            <div class="login-header">
              <h3><i class="fas fa-shield-alt"></i> KIE System</h3>
              <p class="mb-0">Đăng nhập để tiếp tục</p>
            </div>
            <div class="login-body">
              <!-- ✅ ALERT CONTAINER -->
              <div id="alertContainer"></div>

              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <!-- ✅ ADD ID TO INPUT -->
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label class="form-label">Password</label>
                  <!-- ✅ ADD ID TO INPUT -->
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                  />
                </div>
                <!-- ✅ ADD ID TO BUTTON -->
                <button
                  type="submit"
                  id="submitBtn"
                  class="btn btn-primary btn-login w-100"
                >
                  <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                </button>
              </form>

              <!-- <div class="mt-4 text-center">
                <small class="text-muted">
                  Admin mặc định: admin / admin123
                </small>
              </div> -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const submitBtn = document.getElementById("submitBtn");

          // ✅ CLEAR PREVIOUS ALERTS
          clearAlerts();

          // Disable button và show loading
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin me-2"></i>Đang đăng nhập...';

          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (response.ok) {
              showAlert("Đăng nhập thành công!", "success");

              // ✅ USE REDIRECT URL FROM RESPONSE
              setTimeout(() => {
                window.location.href = data.redirect_url || "/";
              }, 1000);
            } else {
              showAlert(
                data.error || "Tên đăng nhập hoặc mật khẩu không đúng",
                "danger"
              );
            }
          } catch (error) {
            showAlert("Lỗi kết nối. Vui lòng thử lại.", "danger");
          } finally {
            // Reset button
            submitBtn.disabled = false;
            submitBtn.innerHTML =
              '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
          }
        });

      // ✅ PROPER ALERT FUNCTIONS
      function showAlert(message, type) {
        const alertContainer = document.getElementById("alertContainer");
        const alert = document.createElement("div");
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
        alertContainer.appendChild(alert);

        // Auto remove after 5 seconds
        setTimeout(() => {
          if (alert.parentNode) {
            alert.remove();
          }
        }, 5000);
      }

      function clearAlerts() {
        const alertContainer = document.getElementById("alertContainer");
        alertContainer.innerHTML = "";
      }

      // ✅ ENTER KEY SUPPORT
      document.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          const form = document.getElementById("loginForm");
          if (form) {
            form.dispatchEvent(new Event("submit"));
          }
        }
      });
    </script>
  </body>
</html>
