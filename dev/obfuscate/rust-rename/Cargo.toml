[package]
name = "digitext-rust-rename"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits", "parsing", "printing"] }
prettyplease = "0.2"

[[bin]]
name = "rust-rename"
path = "src/main.rs"
